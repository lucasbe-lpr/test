<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    html, body {
      margin: 0;
      padding: 0;
      background: #eef1f5;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 8px;
      box-sizing: border-box;
      height: 100%;
      overflow: hidden;
      font-family: 'Roboto', sans-serif;
    }
    #canvasWrap {
      box-shadow: 0 4px 24px rgba(0,0,0,0.18);
      display: inline-block;
      position: relative;
    }
    canvas {
      display: block;
      cursor: grab;
    }
    canvas:active {
      cursor: grabbing;
    }
    #info {
      margin-top: 6px;
      font-size: 0.7rem;
      color: #777;
    }
  </style>
</head>
<body>
<div id="canvasWrap">
  <canvas id="c"></canvas>
</div>
<div id="info">Déplacez l’image en la faisant glisser · La position est sauvegardée</div>

<script>
  (function() {
    // Récupération des props passées par Streamlit
    const props = window.props || {};

    const CANVAS_W = props.width || 1080;
    const CANVAS_H = props.height || 1350;
    const BG_B64   = props.bgImage || '';
    const BG_MIME  = props.bgMime || 'image/jpeg';
    const WM_B64   = props.wmImage || '';
    const WM_MIME  = props.wmMime || 'image/png';
    const TITLE    = props.title || '';
    const SURTITRE = props.subtitle || '';
    const Y_PCT    = (props.yPct || 50) / 100;
    const X_PCT    = 50 / 100;  // toujours centré horizontalement
    const IMG_ZOOM = (props.imgZoom || 100) / 100;
    const BLOCK_COLOR = props.blockColor || '#0068B1';
    const TEXT_COLOR  = props.textColor || '#ffffff';
    const SUR_BG      = props.surBg || '#ffffff';
    const SUR_COLOR   = props.surColor || '#0068B1';
    const WM_SIZE_PCT = 13 / 100;
    const WM_OPAC     = 1.0;
    const WM_POS      = props.wmPosition || 'Haut droite';
    const WM_CX       = props.wmCustomX || 0;
    const WM_CY       = props.wmCustomY || 0;
    const MARGIN_R    = 0.04;

    // Offsets initiaux (reçus de Python)
    let bgOffX = props.offsetX || 0;
    let bgOffY = props.offsetY || 0;

    const canvas = document.getElementById('c');
    const ctx    = canvas.getContext('2d');

    // Taille d'affichage (responsive)
    const AVAIL_H   = window.innerHeight - 100;
    const PREVIEW_W = Math.min(Math.floor(AVAIL_H * CANVAS_W / CANVAS_H), window.innerWidth - 20);
    const UI_ZOOM   = PREVIEW_W / CANVAS_W;
    canvas.width  = CANVAS_W;
    canvas.height = CANVAS_H;
    canvas.style.width  = (CANVAS_W * UI_ZOOM) + 'px';
    canvas.style.height = (CANVAS_H * UI_ZOOM) + 'px';

    let bgImg = null, wmImg = null;
    let isDragging = false, dragSX, dragSY, dragBX, dragBY;

    function clampOffset() {
      if (!bgImg) return;
      const scaleX = CANVAS_W / bgImg.naturalWidth;
      const scaleY = CANVAS_H / bgImg.naturalHeight;
      const base   = Math.max(scaleX, scaleY) * IMG_ZOOM;
      const dw = bgImg.naturalWidth  * base;
      const dh = bgImg.naturalHeight * base;
      const maxOffX = dw / 2 - CANVAS_W / 2;
      const maxOffY = dh / 2 - CANVAS_H / 2;
      bgOffX = Math.max(-maxOffX, Math.min(maxOffX, bgOffX));
      bgOffY = Math.max(-maxOffY, Math.min(maxOffY, bgOffY));
    }

    function roundRect(c, x, y, w, h, r, fill) {
      c.beginPath();
      c.moveTo(x+r, y);
      c.lineTo(x+w-r, y);
      c.arcTo(x+w, y, x+w, y+r, r);
      c.lineTo(x+w, y+h-r);
      c.arcTo(x+w, y+h, x+w-r, y+h, r);
      c.lineTo(x+r, y+h);
      c.arcTo(x, y+h, x, y+h-r, r);
      c.lineTo(x, y+r);
      c.arcTo(x, y, x+r, y, r);
      c.closePath();
      c.fillStyle = fill;
      c.fill();
    }

    function render() {
      ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);
      ctx.fillStyle = '#222';
      ctx.fillRect(0, 0, CANVAS_W, CANVAS_H);

      if (bgImg) {
        const scaleX = CANVAS_W / bgImg.naturalWidth;
        const scaleY = CANVAS_H / bgImg.naturalHeight;
        const base   = Math.max(scaleX, scaleY) * IMG_ZOOM;
        const dw = bgImg.naturalWidth  * base;
        const dh = bgImg.naturalHeight * base;
        const dx = (CANVAS_W - dw) / 2 + bgOffX;
        const dy = (CANVAS_H - dh) / 2 + bgOffY;
        ctx.drawImage(bgImg, dx, dy, dw, dh);
      }

      const fs     = Math.round(CANVAS_W * 0.056);
      const fsSur  = Math.round(CANVAS_W * 0.043);
      const pad    = Math.round(CANVAS_W * 0.017);
      const radius = Math.round(CANVAS_W * 0.019);
      const lh     = Math.round(fs * 1.25);
      const overlap= Math.round(CANVAS_W * 0.003);
      const cx     = X_PCT * CANVAS_W;

      function wrapSegment(text, maxLen) {
        const words = text.split(' ');
        const segs = [];
        let cur = '';
        words.forEach(function(w) {
          if ((cur + w).length < maxLen) {
            cur += (cur ? ' ' : '') + w;
          } else {
            if (cur) segs.push(cur);
            cur = w;
          }
        });
        if (cur) segs.push(cur);
        return segs.length ? segs : [''];
      }

      const lines = [];
      TITLE.split('\n').forEach(function(seg) {
        const wrapped = wrapSegment(seg, 34);
        for (let i = 0; i < wrapped.length; i++) lines.push(wrapped[i]);
      });

      ctx.font = `bold ${fs}px 'Roboto Condensed','Roboto',sans-serif`;
      const lineWidths = lines.map(l => ctx.measureText(l).width + pad*2);

      ctx.font = `bold ${fsSur}px 'Roboto',sans-serif`;
      const surW = ctx.measureText(SURTITRE).width + pad*2;
      const surH = fsSur + Math.round(pad*0.8);

      const totalH  = lh * lines.length;
      const blockTop = CANVAS_H * Y_PCT - totalH/2;

      // Ombre portée (blur)
      const off = document.createElement('canvas');
      off.width = CANVAS_W; off.height = CANVAS_H;
      const octx = off.getContext('2d');
      octx.font = `bold ${fs}px 'Roboto Condensed','Roboto',sans-serif`;
      lines.forEach((line, i) => {
        const lw = lineWidths[i];
        const lx = cx - lw/2;
        const ly = blockTop + i*lh - (i>0 ? overlap : 0);
        roundRect(octx, lx, ly, lw, lh+overlap, radius, BLOCK_COLOR);
      });

      const off2 = document.createElement('canvas');
      off2.width = CANVAS_W; off2.height = CANVAS_H;
      const o2 = off2.getContext('2d');
      o2.filter = 'blur(10px)';
      o2.drawImage(off, 0, 0);
      o2.filter = 'none';
      const id = o2.getImageData(0,0,CANVAS_W,CANVAS_H);
      const px = id.data;
      const [br, bg2, bb] = hexToRgb(BLOCK_COLOR);
      for (let i = 0; i < px.length; i += 4) {
        if (px[i+3] > 60) {
          px[i] = br;
          px[i+1] = bg2;
          px[i+2] = bb;
          px[i+3] = 255;
        } else {
          px[i+3] = 0;
        }
      }
      o2.putImageData(id, 0, 0);
      ctx.drawImage(off2, 0, 0);

      // Surtitre
      const surX = cx - surW/2;
      const surY = blockTop - surH - Math.round(CANVAS_W * -0.000);
      roundRect(ctx, surX, surY, surW, surH, radius, SUR_BG);
      ctx.fillStyle = SUR_COLOR;
      ctx.font = `bold ${fsSur}px 'Roboto',sans-serif`;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      ctx.fillText(SURTITRE, surX+pad, surY+surH/2);

      // Titre principal
      ctx.font = `bold ${fs}px 'Roboto Condensed','Roboto',sans-serif`;
      ctx.fillStyle = TEXT_COLOR;
      ctx.textAlign = 'left';
      ctx.textBaseline = 'middle';
      lines.forEach((line, i) => {
        const lw = lineWidths[i];
        const lx = cx - lw/2;
        const ly = blockTop + i*lh - (i>0 ? overlap : 0);
        ctx.fillText(line, lx+pad, ly+lh/2);
      });

      // Watermark
      if (wmImg) {
        const diag = Math.sqrt(CANVAS_W**2 + CANVAS_H**2);
        const wmW  = diag * WM_SIZE_PCT;
        const wmH  = (wmImg.naturalHeight / wmImg.naturalWidth) * wmW;
        const mx   = CANVAS_W * MARGIN_R;
        const my   = CANVAS_H * MARGIN_R;
        let wx, wy;
        const posMap = {
          'Haut gauche':   [mx, my],
          'Haut centre':   [(CANVAS_W - wmW)/2, my],
          'Haut droite':   [CANVAS_W - wmW - mx, my],
          'Milieu gauche': [mx, (CANVAS_H - wmH)/2],
          'Centre':        [(CANVAS_W - wmW)/2, (CANVAS_H - wmH)/2],
          'Milieu droite': [CANVAS_W - wmW - mx, (CANVAS_H - wmH)/2],
          'Bas gauche':    [mx, CANVAS_H - wmH - my],
          'Bas centre':    [(CANVAS_W - wmW)/2, CANVAS_H - wmH - my],
          'Bas droite':    [CANVAS_W - wmW - mx, CANVAS_H - wmH - my],
          'Coordonnées personnalisées': [WM_CX, WM_CY],
        };
        [wx, wy] = posMap[WM_POS] || [CANVAS_W - wmW - mx, CANVAS_H - wmH - my];
        ctx.globalAlpha = WM_OPAC;
        ctx.drawImage(wmImg, wx, wy, wmW, wmH);
        ctx.globalAlpha = 1.0;
      }
    }

    function hexToRgb(hex) {
      const r = parseInt(hex.slice(1,3), 16);
      const g = parseInt(hex.slice(3,5), 16);
      const b = parseInt(hex.slice(5,7), 16);
      return [r, g, b];
    }

    // Gestion du drag
    canvas.addEventListener('mousedown', function(e) {
      if (!bgImg) return;
      isDragging = true;
      dragSX = e.clientX;
      dragSY = e.clientY;
      dragBX = bgOffX;
      dragBY = bgOffY;
      canvas.style.cursor = 'grabbing';
    });

    window.addEventListener('mousemove', function(e) {
      if (!isDragging) return;
      const scale = 1 / UI_ZOOM;
      bgOffX = dragBX + (e.clientX - dragSX) * scale;
      bgOffY = dragBY + (e.clientY - dragSY) * scale;
      clampOffset();
      render();
    });

    window.addEventListener('mouseup', function() {
      if (isDragging) {
        isDragging = false;
        canvas.style.cursor = bgImg ? 'grab' : 'default';
        // Envoyer les nouvelles coordonnées à Python
        sendOffsets(bgOffX, bgOffY);
      }
    });

    if (bgImg) canvas.style.cursor = 'grab';

    function sendOffsets(x, y) {
      // Arrondir pour éviter trop de reruns
      const roundedX = Math.round(x);
      const roundedY = Math.round(y);
      window.parent.postMessage({
        type: 'streamlit:setComponentValue',
        value: { offsetX: roundedX, offsetY: roundedY }
      }, '*');
    }

    // Chargement des images
    let loaded = 0;
    const toLoad = (BG_B64 ? 1 : 0) + (WM_B64 ? 1 : 0);
    function onLoad() {
      loaded++;
      if (loaded >= toLoad || toLoad === 0) {
        clampOffset();
        render();
        // Envoyer les offsets initiaux à Python pour synchronisation
        // (au cas où ils auraient changé depuis le dernier rerun)
        sendOffsets(bgOffX, bgOffY);
      }
    }

    if (BG_B64) {
      bgImg = new Image();
      bgImg.onload = onLoad;
      bgImg.src = 'data:' + BG_MIME + ';base64,' + BG_B64;
    }
    if (WM_B64) {
      wmImg = new Image();
      wmImg.onload = onLoad;
      wmImg.src = 'data:' + WM_MIME + ';base64,' + WM_B64;
    }
    if (toLoad === 0) onLoad();

    // Adaptation responsive
    window.addEventListener('resize', function() {
      const newW = Math.min(Math.floor((window.innerHeight - 100) * CANVAS_W / CANVAS_H), window.innerWidth - 20);
      const newZoom = newW / CANVAS_W;
      canvas.style.width = (CANVAS_W * newZoom) + 'px';
      canvas.style.height = (CANVAS_H * newZoom) + 'px';
      // On ne redessine pas, le canvas reste en haute résolution
    });

  })();
</script>
</body>
</html>
